# Benchmark contract — benchmark-latent-reconstruction-prediction-architectures
#
# This file is THE contract for the heavy architecture benchmark. `ssl_anomaly
# .benchmarking.config.load_benchmark_config` refuses to load a version of it
# that cannot produce the committed matrix, and every run manifest stores
# `benchmark_config_sha256` so a mid-run edit is detectable (research-integrity
# rule 7: "no hidden configuration changes; the committed matrix is the contract").
#
# Editing anything here after cells have run requires an `amendments:` entry
# (date + target + reason + approved_by) — same discipline as
# configs/evaluation/pre_registration.yaml.
#
# Frozen things this change never touches: splits_locked_v2.json,
# holdout_manifest_v2.json, B1's sidecar, gru_ae_main checkpoints, findings
# 00–25, the platform, and the locked `test` split (no code path here can read it).

version: 1
created: "2026-11-23"
change: benchmark-latent-reconstruction-prediction-architectures
companion_change: regional-ssl-representation-evaluation   # the capstone owns claim semantics

# ---------------------------------------------------------------------------
# Axes (ids resolved by ssl_anomaly.benchmarking.config)
# ---------------------------------------------------------------------------
seeds: [13, 42, 2026]
screening_seeds: [13]          # screening is the seed-13 projection of the same matrix
architectures: [A1, A2, A3, A4, A5, A6, A7, A8, A9, A10]
baselines: [B1, BL-RULE, BL-IF, BL-OCSVM, BL-RPCA, A-RAND]
suppressions: [S0, S1, S2, S3]
inputs: [I1, I2, I3]
weather_fusions: [W0, W1, W2]
calibrations: [C1, C2, C3]
protocols: [V1, V2, V3]
levels: [farm, patch]          # `patch` cells exist to be Deferred, not to be hidden

# ---------------------------------------------------------------------------
# Data bindings (v2 chain only)
# ---------------------------------------------------------------------------
artifacts:
  cycles_490_v2:
    path: data/processed/cycles_490_v2.parquet
    sha256_prefix: null          # no owner-recorded byte hash for the parquet exists
    hash_policy: pin_at_runtime  # the run hashes what it reads and pins it in the manifest
    pin_field: cycles_sha256
    record: "4,458 windows / 3,478 non-censored / 490 fields; median 366 d; 36 × 15-day bins"
    required_for: all
  splits_locked_v2:
    path: data/processed/splits_locked_v2.json
    sha256_prefix: "30ecbe10"
    record: "train 2,105 / dev 340 / test 773 / monitoring 1,240 (locked)"
    required_for: all
  holdout_manifest_v2:
    path: data/processed/holdout_manifest_v2.json
    sha256_prefix: "d501bf81"
    record: "37 holdout-excluded test-block fields; archive end 2026-09-10"
    required_for: all
  norm_stats_full_v2:
    path: data/processed/norm_stats_full_v2.json
    sha256_prefix: "493f0395"
    record: "2,105 locked train cycles; v2 rebuild (v1 PoC norm 3cb1ca60 NOT used)"
    required_for: all
  weather_daily_v2:
    path: data/processed/weather_daily.parquet
    sha256_prefix: null
    hash_policy: pin_at_runtime
    pin_field: weather_sha256
    record: "daily ERA5-derived covariates + retrospective 3/7/14/30 d windows (hourly out of v0 scope)"
    required_for: weather_inputs
  patch_store_v2:
    path: data/patch_runs/v3/patches.zarr
    sha256_prefix: null
    record: "(490,12,36,8,48,48) v2 re-extraction; owner action still pending in todo.md"
    required_for: patch_level
  stl_features:
    path: data/processed/decomposition/stl_features.parquet
    sha256_prefix: null
    record: "optional B5-class STL features from decomposition-aware-ssl-study; `absent` if not produced"
    required_for: optional

# ---------------------------------------------------------------------------
# Hardware and compute policy (AGENTS.md §6)
# ---------------------------------------------------------------------------
hardware:
  accelerator: "NVIDIA T4 (Google Colab)"
  allow_cpu_for: [preprocessing, classical_baselines, unit_tests, smoke]
  mixed_precision: auto          # bf16 when the device supports it, else fp32; recorded per run
  grad_accumulation_steps: 1
  release_memory_between_cells: true
  peak_vram_measure: torch.cuda.max_memory_allocated

budget:
  t4_hours: 6.0                  # owner knob for the FIRST cycle; amend, do not silently raise
  max_epochs_screening: 6
  per_experiment_estimate_source: smoke_profile
  on_exhaustion: defer
  deferral_note: >-
    Deferred cells stay in the registry and in every report; no gate, headline or
    winner may cite a deferred cell as passing evidence.

feasibility:
  # Design §Backbone notes: at L=36 the Mamba arms are expected to be dominated by
  # simpler backbones and are kept only because the owner asked to test them. The
  # gate below is what makes "kept" honest instead of optimistic.
  mamba_wall_time_factor_of_gru_twin: 2.0
  numerical_stability:
    require_finite: true
    max_abs_logit: 30.0
    max_grad_norm: 100.0
  not_applicable: []             # filled in-place by the runner when the gate triggers

# ---------------------------------------------------------------------------
# Capacity fairness (design §Capacity fairness)
# ---------------------------------------------------------------------------
capacity:
  target_params: 120000
  min_ratio: 0.80
  max_ratio: 1.20
  laptop_max_params: 250000      # AGENTS.md dev budget; the smoke profile must fit it
  band_semantics: "trainable params of the objective module + backbone, excluding buffers and the scoring head's calibration tables"
  tuning: d_model_grid           # sizes are chosen by a recorded deterministic search, never free-hand
  d_model_grid: [32, 48, 64, 80, 96, 112, 128, 160, 192, 224, 256]
  flops_convention: >-
    MACs counted by a single forward pass at the reference batch shape
    (batch 32, T=36, C=d_in) using per-layer analytic formulas (GRU 6·d·(d_in+d),
    Linear 2·in·out, Conv1d 2·kern·in·out·L, selective scan 2·d_state·d·L·2 for
    the fwd/bwd pair); attention is not used by any A-arm. The convention string
    itself is written into every manifest.

# ---------------------------------------------------------------------------
# Training defaults (pre-registered; HPO may only move inside `search.budgets`)
# ---------------------------------------------------------------------------
training:
  optimizer: adamw
  lr: 2.0e-3
  lr_range: [3.0e-4, 3.0e-3]
  weight_decay: 1.0e-5
  batch_size: 32
  epochs_full: 40
  epochs_screening: 6
  early_stop: {monitor: dev_objective_loss, mode: min, patience: 6}
  grad_clip_norm: 1.0
  eval_every_epochs: 2
  num_workers: 0
  progress: {tqdm: true, progress_jsonl: true}
  loss: smooth_l1
  huber_beta: 1.0
  n_bins: 36
  bin_days: 15
  channels: [ndvi, blue, green, red, nir, swir1, swir2, lst]
  horizon_k: 4                   # prediction arms forecast bins t+1..t+k (pre-registered)
  lambda_rec: 1.0
  lambda_pred: 1.0
  lambda_variants:
    lam0.5: {lambda_rec: 1.0, lambda_pred: 0.5}
    lam1.0: {lambda_rec: 1.0, lambda_pred: 1.0}
    lam2.0: {lambda_rec: 1.0, lambda_pred: 2.0}
  ema_momentum: 0.996            # target-encoder EMA for A3/A4/A7/A8
  mask_token: learned
  seed_streams: true
  # ---- structural knobs the arm constructors read (no hidden defaults) --------
  d_model: 96                    # tuned per arm inside capacity.d_model_grid
  n_layers: 1
  dropout: 0.1
  latent_dim: 32
  d_state: 16                    # selective-scan state width for the Mamba arms
  # Masking rate for arms whose objective is MASKED by construction. A1/A2 stay
  # unmasked (pure leave-one-bin-out reconstruction) — that difference, not the loss
  # name, is what separates A1 from A3 beyond the space the error lives in. Masking
  # is applied at TRAIN time only: at eval the score reads the archive's own
  # observation pattern, so a hidden-bin augmentation can never inflate a metric.
  masking:
    applied_at: train_only
    rate_by_paradigm:
      input_reconstruction: 0.0
      latent_reconstruction: 0.15
      future_prediction: 0.15
      jepa: 0.15
      hybrid: 0.15

# ---------------------------------------------------------------------------
# Latent stability (mandatory for A3/A4/A7/A8; spec "Latent representation stability")
# ---------------------------------------------------------------------------
collapse:
  mechanism: ema_target_encoder
  mechanism_doc: >-
    A stop-gradient target branch produced by an EMA copy of the context encoder
    (momentum in `training.ema_momentum`). The latent arms carry no decoder in the
    gradient path, so without this an L2 latent objective has the constant solution
    z ≡ 0 available; the EMA target plus a variance-preserving term is what removes
    that shortcut. Named and justified here as the design requires.
  applies_to: [A3, A4, A7, A8]
  effective_rank_ratio_floor: 0.10
  min_per_dim_std: 0.01
  max_zero_variance_dims_frac: 0.20
  max_top_eigenvalue_share: 0.99
  check_every_epochs: 2
  on_trigger: disqualify          # never retune-until-pass (spec scenario)
  content_probe:
    required_for: [A7, A8]
    estimator: ridge
    target: phase_bin
    min_spearman: 0.10
    on_fail: invalid-content-probe

# ---------------------------------------------------------------------------
# Synthetic anomaly panel (design §Synthetic anomaly generation)
# ---------------------------------------------------------------------------
synthetic:
  families: [spectral, temporal, phenological, multivariate, persistent]
  severities: [weak, moderate, strong]
  severity_scale_source: per-channel_MAD_of_clean_dev_cycles
  severity_multipliers: {weak: 0.75, moderate: 1.5, strong: 3.0}
  test_prevalence: 0.10           # one predefined prevalence for every cell
  events_per_cell: 160
  bins_per_event_range: [2, 6]
  combined_scenarios:
    - {name: persistent_spectral_multivariate, families: [persistent, spectral, multivariate]}
    - {name: temporal_phenological, families: [temporal, phenological]}
  trivial_separability:
    audited_against: clean_data_MAD
    flag_if: ">= 0.98 of injected |delta| exceeds 4 × the channel MAD"
    action: flag_and_exclude      # flagged configurations are excluded, not kept quietly
  train_generator:
    seed: 777
    pool: train_cycles_only
    independent_from_eval: true
    disjoint_sample_pool: true
    isolation_check: sha256_of_(field_id,cycle_id,start_bin,family,severity)
  eval_generator:
    seed: 12345
    pool: dev_cycles_only
    disjoint_sample_pool: true
    note: "separate rng stream AND separate cycle pool from the S3 train generator"

# ---------------------------------------------------------------------------
# Normality and calibration (design §Normality modelling and calibration)
# ---------------------------------------------------------------------------
normality:
  paradigm: hybrid
  components: [farm_history, phenological_context, environmental_conditioning]
  rule: >-
    A farm is compared to its OWN history conditioned on phase first; pooled
    cross-farm statistics may only fill a per-farm deficit (fewer than
    min_history_cycles clean cycles), and every such fill is recorded in the
    manifest as `pooled_fill` with the count.
  min_history_cycles: 2
  shrinkage: empirical_bayes
  stage_bins: 12

calibration:
  sources: [train, dev]
  test_usage: forbidden
  thresholds_selected_on: dev
  alarm_budget: 0.10              # cycle-FAR budget shared by every arm (finding-25 semantics)

# ---------------------------------------------------------------------------
# Evaluation contract (spec experimental-validation)
# ---------------------------------------------------------------------------
evaluation:
  allowed_splits: [train, dev]
  forbidden_splits: [test, monitoring]
  primary_metric: auprc
  metric_levels: [event, point, patch, farm]
  macro_average: equal_cell_weight
  per_cell_tables: true
  headline_grid: "5 families × 3 severities"
  secondary: [auroc, f1, detection_delay, spearman, kendall, brier, ece,
              inference_latency, peak_vram, params, flops]
  threshold_rule: "max-F1 over a 101-point quantile grid on dev only (evaluation.metrics.select_threshold_on_validation)"
  bootstrap_B: 2000
  bootstrap_resample: [farm, event]
  multiple_comparison: {default: holm, screening: benjamini_hochberg}
  variance_decomposition: [seed, farm, temporal, event]
  winner_reports: [detection, generalization, multi_objective]
  rung_ceiling: L3                # proxies never lift a claim above L3; L4 unsupported
  environmental:
    indicators: [TVDI, CWSI_ET, CWSI_LST, ETa, ETrF]
    correlations: [spearman, kendall]
    dependence_uncertainty: block_bootstrap_by_field_year
    usable_for: [reporting]       # NOT calibration, NOT selection, NOT rung promotion
    caveat: >-
      No indicator in this archive is independent of the model inputs; every table
      built from one prints its input-overlap class (shared-input vs closest-to-
      independent) beside it.

search:
  validation_only: true
  selection_metric: macro_auprc
  selection_panel: validation_injection_panel   # synthetic panel on dev, never test
  n_trials: 8
  wall_minutes_cap: 25
  budgets:
    A1:  {trials: 8, space: {d_model: [64, 96, 128], n_layers: [1, 2], lr: "log[3e-4, 3e-3]", dropout: [0.0, 0.1, 0.2]}}
    A2:  {trials: 8, space: {d_model: [64, 96, 128], n_layers: [1, 2], d_state: [8, 16], lr: "log[3e-4, 3e-3]"}}
    A3:  {trials: 8, space: {d_model: [64, 96, 128], latent_dim: [16, 32, 64], lr: "log[3e-4, 3e-3]"}}
    A4:  {trials: 8, space: {d_model: [64, 96, 128], latent_dim: [16, 32, 64], d_state: [8, 16], lr: "log[3e-4, 3e-3]"}}
    A5:  {trials: 8, space: {d_model: [64, 96, 128], n_layers: [1, 2], horizon_k: [1, 2, 4], lr: "log[3e-4, 3e-3]"}}
    A6:  {trials: 8, space: {d_model: [64, 96, 128], horizon_k: [1, 2, 4], d_state: [8, 16], lr: "log[3e-4, 3e-3]"}}
    A7:  {trials: 8, space: {d_model: [64, 96, 128], latent_dim: [16, 32, 64], ema_momentum: [0.9, 0.996], lr: "log[3e-4, 3e-3]"}}
    A8:  {trials: 8, space: {d_model: [64, 96, 128], latent_dim: [16, 32, 64], d_state: [8, 16], lr: "log[3e-4, 3e-3]"}}
    A9:  {trials: 8, space: {d_model: [64, 96, 128], lambda_pred: [0.5, 1.0, 2.0], lr: "log[3e-4, 3e-3]"}}
    A10: {trials: 8, space: {d_model: [64, 96, 128], lambda_pred: [0.5, 1.0, 2.0], d_state: [8, 16], lr: "log[3e-4, 3e-3]"}}
    BL-IF:     {trials: 8, space: {n_estimators: [100, 200, 400], max_samples: [0.5, 0.8, 1.0], contamination: [0.02, 0.05, 0.1]}}
    BL-OCSVM:  {trials: 8, space: {nu: [0.01, 0.05, 0.1, 0.2], gamma: [scale, 0.01, 0.1]}}
    BL-RPCA:   {trials: 8, space: {lam: [0.05, 0.1, 0.2, 0.4], iters: [100, 300, 600]}}
  unsearchable:
    B1: "fixed phase-aware robust z-score rule; its only knob (the threshold) is set by the calibration axis C*, not by HPO"
    BL-RULE: "FAR-matched NDVI+LST rule; threshold chosen by the same C* calibration, no model to tune"
    A-RAND: "random-init capacity control; training it would make it a different arm"

