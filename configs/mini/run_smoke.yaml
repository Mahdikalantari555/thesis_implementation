# Smoke configuration: light, CPU, single-farm protocol.
name: mini_smoke
store_root: "D:/RS/Thesis/Data/Processed/mini_research_dataset"
representation:
  spatial: full_field
  temporal: sliding
  window_length: 60
  stride: 60
  include_delta_t: true
  include_indices: true
  weather_group: weather_core
protocol:
  name: single_farm
  # Farms come from the store (selection layer 3farms_dev.geojson).
  # Empty train_farms = first farm in the store; empty test_farms = all others.
  train_farms: []
  test_farms: []
  holdout_boundary: "2024-01-01"
  justification: "Accepted mini split 2026-11-25: train <= 2022, dev 2023, test 2024+ (docs/mini_lab_regional_eval_plan.md §9)."
model:
  name: gru_ae
  d_model: 16
  latent_dim: 8
  n_layers: 1
  dropout: 0.1
  epochs: 2
  batch_size: 8
  lr: 0.001
  seeds: [13, 42]
  device: auto
out_root: "D:/RS/Thesis/Data/Processed/mini_research_dataset/experiments"
resume: false
n_trials: 2
claim_rung: L2
