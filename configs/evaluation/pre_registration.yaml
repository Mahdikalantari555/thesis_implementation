# FROZEN BEFORE ANY RESULT IS OBSERVED (change task 0.1).
# Any later deviation MUST be added below under `amendments:` with its date and
# reason; the gate aggregator marks a result `invalid-posthoc` when a gate in
# this file differs from the one the report used.
#
# Hash of this document is recorded in every Level-1/Level-2 output manifest
# (`preregistration_sha256`) and in the capstone findings document.

